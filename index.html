<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Don's & Sam's Secret DGU Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            text-align: center;
        }

        .hero {
            max-width: 800px;
            margin: 60px auto;
            padding: 50px 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-size: 48px;
            margin: 0 0 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .button {
            display: block;
            width: 280px;
            padding: 18px 20px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.2s;
        }

        .football {
            background: #09C90E;
        }

        .survivor {
            background: #F28C28;
        }

        .button:hover {
            transform: translateY(-3px);
            opacity: 0.85;
        }

        @media (max-width: 650px) {
            .hero {
                margin: 30px 15px;
                padding: 40px 20px;
            }

            h1 {
                font-size: 38px;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }

            .button {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Don's & Sam's DGU Hub</h1>

        <div class="buttons">
            <a class="button football" href="https://lasportsfan62.github.io/Football/">
                Football
            </a>

            <a class="button survivor" href="https://lasportsfan62.github.io/Survivor/">
                Survivor
            </a>
        </div>
    </div>

</body>
</html>
